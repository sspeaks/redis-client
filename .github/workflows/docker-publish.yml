name: Publish Release Artifacts

on:
  push:
    tags:
    - "redis-client-v*"
    - "hask-redis-mux-v*"

jobs:
  verify-release:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      package_name: ${{ steps.release.outputs.package_name }}
      package_version: ${{ steps.release.outputs.package_version }}
      docker_sha_tag: ${{ steps.release.outputs.docker_sha_tag }}

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        nix_path: nixpkgs=channel:nixos-25.05

    - id: release
      name: Parse release tag
      run: |
        release_tag="${GITHUB_REF_NAME}"
        case "$release_tag" in
          redis-client-v*)
            package_name="redis-client"
            package_version="${release_tag#redis-client-v}"
            ;;
          hask-redis-mux-v*)
            package_name="hask-redis-mux"
            package_version="${release_tag#hask-redis-mux-v}"
            ;;
          *)
            echo "Unsupported release tag: $release_tag" >&2
            exit 1
            ;;
        esac
        docker_sha_tag="sha-${GITHUB_SHA::12}"
        {
          echo "package_name=$package_name"
          echo "package_version=$package_version"
          echo "docker_sha_tag=$docker_sha_tag"
        } >> "$GITHUB_OUTPUT"

    - name: Validate release metadata
      run: |
        release_tag="${GITHUB_REF_NAME}"
        case "${{ steps.release.outputs.package_name }}" in
          redis-client)
            python3 scripts/check-release-metadata.py \
              --release-tag "$release_tag" \
              --commit-sha "$GITHUB_SHA" \
              --docker-tag "${{ steps.release.outputs.package_version }}" \
              --docker-tag "${{ steps.release.outputs.docker_sha_tag }}" \
              --docker-tag latest \
              --allow-latest
            ;;
          hask-redis-mux)
            python3 scripts/check-release-metadata.py --release-tag "$release_tag"
            ;;
        esac

  publish-docker:
    needs: verify-release
    if: needs.verify-release.outputs.package_name == 'redis-client'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        nix_path: nixpkgs=channel:nixos-25.05

    - name: Build Docker image
      run: nix-build default.nix -A dockerImage --argstr dockerTag "${{ needs.verify-release.outputs.package_version }}"

    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Load and push image
      run: |
        docker load < result
        docker tag ghcr.io/sspeaks/redis-client:${{ needs.verify-release.outputs.package_version }} ghcr.io/sspeaks/redis-client:${{ needs.verify-release.outputs.docker_sha_tag }}
        docker tag ghcr.io/sspeaks/redis-client:${{ needs.verify-release.outputs.package_version }} ghcr.io/sspeaks/redis-client:latest
        docker push ghcr.io/sspeaks/redis-client:${{ needs.verify-release.outputs.package_version }}
        docker push ghcr.io/sspeaks/redis-client:${{ needs.verify-release.outputs.docker_sha_tag }}
        docker push ghcr.io/sspeaks/redis-client:latest
