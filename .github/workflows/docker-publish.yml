name: Publish Release Artifacts

on:
  push:
    tags:
    - "redis-client-v*"
    - "hask-redis-mux-v*"

jobs:
  verify-release:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      package_name: ${{ steps.release.outputs.package_name }}
      package_version: ${{ steps.release.outputs.package_version }}
      docker_sha_tag: ${{ steps.release.outputs.docker_sha_tag }}

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - id: release
      name: Parse release tag
      run: |
        release_tag="${GITHUB_REF_NAME}"
        case "$release_tag" in
          redis-client-v*)
            package_name="redis-client"
            package_version="${release_tag#redis-client-v}"
            ;;
          hask-redis-mux-v*)
            package_name="hask-redis-mux"
            package_version="${release_tag#hask-redis-mux-v}"
            ;;
          *)
            echo "Unsupported release tag: $release_tag" >&2
            exit 1
            ;;
        esac
        {
          echo "package_name=$package_name"
          echo "package_version=$package_version"
          echo "docker_sha_tag=sha-${GITHUB_SHA::12}"
        } >> "$GITHUB_OUTPUT"

    - name: Validate release metadata
      run: |
        release_tag="${GITHUB_REF_NAME}"
        case "${{ steps.release.outputs.package_name }}" in
          redis-client)
            python3 scripts/check-release-metadata.py \
              --release-tag "$release_tag" \
              --commit-sha "$GITHUB_SHA" \
              --docker-tag "${{ steps.release.outputs.package_version }}" \
              --docker-tag "${{ steps.release.outputs.docker_sha_tag }}" \
              --docker-tag latest \
              --allow-latest
            ;;
          hask-redis-mux)
            python3 scripts/check-release-metadata.py --release-tag "$release_tag"
            ;;
        esac

  publish-github-release:
    needs: verify-release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

    - name: Build package source distribution
      env:
        PACKAGE_NAME: ${{ needs.verify-release.outputs.package_name }}
      run: |
        mkdir release-artifacts
        nix develop --no-update-lock-file --no-write-lock-file --command \
          cabal sdist "pkg:$PACKAGE_NAME" --output-dir release-artifacts

    - name: Prepare package release notes
      run: |
        python3 scripts/check-release-metadata.py \
          --release-tag "$GITHUB_REF_NAME" \
          --write-release-notes release-notes.md

    - name: Create namespaced GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          release-artifacts/*.tar.gz \
          --title "$GITHUB_REF_NAME" \
          --notes-file release-notes.md

  publish-docker:
    needs: verify-release
    if: needs.verify-release.outputs.package_name == 'redis-client'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

    - name: Build locked Docker image
      run: nix build --no-update-lock-file --no-write-lock-file .#dockerImage

    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Load and push immutable and stable image tags
      run: |
        docker load < result
        source_image="ghcr.io/sspeaks/redis-client:latest"
        version_image="ghcr.io/sspeaks/redis-client:${{ needs.verify-release.outputs.package_version }}"
        sha_image="ghcr.io/sspeaks/redis-client:${{ needs.verify-release.outputs.docker_sha_tag }}"
        docker tag "$source_image" "$version_image"
        docker tag "$source_image" "$sha_image"
        docker push "$version_image"
        docker push "$sha_image"
        docker push "$source_image"
