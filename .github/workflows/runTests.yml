name: Tests CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        nix_path: nixpkgs=channel:nixos-25.05

    - name: Validate pull request template
      run: python3 .github/tests/test_pull_request_template.py

    - name: Validate Copilot setup workflow contract
      run: python3 .github/tests/test_copilot_setup_workflow.py

    - name: Test
      run: make test

    - name: Benchmark smoke
      run: make benchmark-smoke

    - name: Upload benchmark smoke artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-smoke-results
        path: artifacts/benchmark-smoke/*.json
        if-no-files-found: error
