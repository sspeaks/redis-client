services:
  redis1:
    image: redis:7.2.12
    hostname: redis1.local
    command: &redis-command
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --bind
      - 0.0.0.0
      - --port
      - "6379"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /data/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-port
      - "6379"
      - --cluster-announce-bus-port
      - "16379"
      - --cluster-announce-ip
      - redis1.local
    environment:
      REDIS_PORT: "6379"
    healthcheck: &redis-healthcheck
      test: ["CMD-SHELL", "redis-cli -p \"$${REDIS_PORT}\" ping | grep -qx PONG"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 2s

