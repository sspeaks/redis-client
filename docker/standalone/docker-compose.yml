services:
  redis:
    image: redis
    hostname: redis.local
    user: "${REDIS_TLS_CERT_UID:?Set REDIS_TLS_CERT_UID}:${REDIS_TLS_CERT_GID:?Set REDIS_TLS_CERT_GID}"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - ${REDIS_TLS_CERT_DIR:?Set REDIS_TLS_CERT_DIR}/redis-ca.crt:/certs/redis-ca.crt:ro
      - ${REDIS_TLS_CERT_DIR:?Set REDIS_TLS_CERT_DIR}/redis-server.crt:/certs/redis-server.crt:ro
      - ${REDIS_TLS_CERT_DIR:?Set REDIS_TLS_CERT_DIR}/redis-server.key:/certs/redis-server.key:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      default:
        aliases:
          - redis.local
  e2etests:
    image: "${REDIS_E2E_IMAGE:-e2etests:latest}"
    depends_on: [redis]
    volumes:
      # This ephemeral CA is test-only trust material and must never be reused.
      - ${REDIS_TLS_CERT_DIR:?Set REDIS_TLS_CERT_DIR}/redis-ca.crt:/certs/redis-ca.crt:ro
    networks:
      default:
        aliases:
          - e2etests

networks:
  default:
    driver: bridge